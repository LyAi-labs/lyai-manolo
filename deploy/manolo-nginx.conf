server {
    listen 80;
    server_name manolo.lyai.fr;
    root /usr/share/nginx/html;
    index index.html;

    # Fallback SPA: cualquier ruta desconocida sirve index.html
    # (React Router resuelve la ruta en cliente). /api lo intercepta
    # Traefik antes de llegar aquí, así que no interfiere.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
